        #loader {

        @keyframes spin { to { transform: rotate(360deg); } }

        .fade-in { animation: fadeIn 0.5s forwards; }

        .search-box::placeholder { color: #ccc; }

        .tg-fab {

            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
            display: flex; align-items: center; gap: 8px; transition: var(--transition);
        }
        .tg-fab:active { transform: scale(0.9); }

        .hero { 
            height: 75vh; position: relative; 
            background-size: cover; background-position: center top; 
            display: flex; align-items: flex-end; 
            transition: background-image 0.5s ease-in-out;
            padding-top: 70px;
        }
        .hero::after { 
            content: ''; position: absolute; inset: 0; 
            background: linear-gradient(to top, var(--bg) 5%, rgba(0,0,0,0.5) 40%, rgba(0,0,0,0.2) 100%); 
        }
        .hero-content { position: relative; z-index: 2; padding: 40px 5%; width: 100%; text-align: center; }
        .btn-play-hero { 
            background: #fff; color: #000; border: none; padding: 14px 40px; 
            border-radius: 4px; font-weight: 900; font-size: 16px; 
            cursor: pointer; transition: var(--transition); 
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-play-hero:hover { background: #e6e6e6; transform: scale(1.05); }
        .btn-play-hero:active { transform: scale(0.95); opacity: 0.8; }

        .section-title { font-size: 20px; font-weight: 800; margin: 30px 5% 15px; border-right: 4px solid var(--accent); padding-right: 12px; display: flex; justify-content: space-between; align-items: center;}
        .scroll-list { display: flex; overflow-x: auto; padding: 10px 5% 30px; gap: 15px; scrollbar-width: none; }
        .scroll-list::-webkit-scrollbar { display: none; }
        
        .card { 
            min-width: 130px; position: relative; cursor: pointer; 
            border-radius: 6px; transition: var(--transition);
            transform-origin: center;
        }
        .card img { 
            width: 100%; height: 190px; border-radius: 6px; object-fit: cover; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: var(--transition);

        .card::after {
            content: ''; position: absolute; inset: 0; border-radius: 6px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 50%);
            opacity: 0; transition: var(--transition);
        }
        .card:hover, .card:active { transform: scale(1.08); z-index: 10; }
        .card:hover::after, .card:active::after { opacity: 1; }
        .card:hover img, .card:active img { box-shadow: 0 10px 20px rgba(0,0,0,0.8); }

        .continue-card { min-width: 200px; }
        .continue-card img { height: 120px; opacity: 0.8; }

        #details-page { display: none; position: fixed; inset: 0; z-index: 2000; background: var(--bg); overflow-y: auto; padding-top: 70px; }
        
        /* التعديل الجذري للمشغل: يثبت تحت الهيدر وما يغطي على شيء */
        #video-container {

            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            position: relative; /* رجعناه للوضع الطبيعي */
            z-index: 2100;

        .next-ep-btn {

            "غلط بنات": { 1: "//ok.ru/videoembed/11877199253761?nochat=1", 2: "//ok.ru/videoembed/11877224485121?nochat=1", 3: "//ok.ru/videoembed/11946871099649?nochat=1", 4: "//ok.ru/videoembed/11970809237761?nochat=1", 5: "//ok.ru/videoembed/11970820575489?nochat=1", 6: "//ok.ru/videoembed/11978952544513?nochat=1", 7: "https://ok.ru/videoembed/12017848881409?nochat=1" },
            "بنات عبدالغني": { 1: "//ok.ru/videoembed/11877298606337?nochat=1", 2: "//ok.ru/videoembed/11877316169985?nochat=1", 3: "//ok.ru/videoembed/11971058536705?nochat=1", 4: "//ok.ru/videoembed/11971076493569?nochat=1", 5: "//ok.ru/videoembed/11971094909185?nochat=1", 6: "https://ok.ru/videoembed/12011148546305?nochat=1" },
            "الغميضه": { 1: "//ok.ru/videoembed/11877036003585?nochat=1", 2: "//ok.ru/videoembed/11877046817025?nochat=1", 3: "//ok.ru/videoembed/11946930475265?nochat=1", 4: "//ok.ru/videoembed/11970507247873?nochat=1", 5: "//ok.ru/videoembed/11973971480833?nochat=1", 6: "https://ok.ru/videoembed/12011156738305?nochat=1" },
            "الأم المتوحشة": { 1: "//ok.ru/videoembed/11877332291841?nochat=1", 2: "//ok.ru/videoembed/11877351166209?nochat=1" },
            "عرس الجن": { 1: "//ok.ru/videoembed/11877366698241?nochat=1", 2: "//ok.ru/videoembed/11877380395265?nochat=1" },
            "حي الجراديه": { 1: "//ok.ru/videoembed/11877090857217?nochat=1", 2: "//ok.ru/videoembed/11877113729281?nochat=1", 3: "//ok.ru/videoembed/11946884993281?nochat=1", 4: "//ok.ru/videoembed/11970692780289?nochat=1", 5: "//ok.ru/videoembed/11970709033217?nochat=1", 6: "//ok.ru/videoembed/11978994684161?nochat=1", 7: "https://ok.ru/videoembed/12017863233793?nochat=1" }, 
            "الحصة الأخيرة": { 1: "//ok.ru/videoembed/11877062807809?nochat=1", 2: "//ok.ru/videoembed/11970553516289?nochat=1", 3: "//ok.ru/videoembed/11970582679809?nochat=1", 4: "//ok.ru/videoembed/11970597818625?nochat=1", 5: "//ok.ru/videoembed/11984614199553?nochat=1", 6: "https://ok.ru/videoembed/12022191296769?nochat=1" }
        };

        const sheetID = "1UChkTwIZFxkwV0vDepyNcWNe0Gb6eSbpDajdWX5mvOE";
        const episodesSheet = "Sheet1"; 
        const seriesSheet = "Series"; 

        let currentlyPlayingSeries = "";
        let currentlyPlayingEp = 0;

        async function initApp() {
            try {
                const resSeries = await fetch(`https://opensheet.elk.sh/${sheetID}/${seriesSheet}`);
                if (resSeries.ok) {
                    const newSeries = await resSeries.json();
                    newSeries.forEach(row => {
                        if (row.name && !seriesDB.find(s => s.name === row.name)) {
                            let categoryName = row.cat;
                            if(row.cat === 'trending') categoryName = 'رمضان 2026';
                            if(row.cat === 'comedy') categoryName = 'كوميديا';
                            if(row.cat === 'drama') categoryName = 'دراما';

                            seriesDB.unshift({
                                name: row.name,
                                cat: categoryName || "عام",
                                year: row.year || "2026",
                                genre: row.genre || "دراما",
                                img: row.img || "https://i.ibb.co/hJTvQBRJ/20260216-133106.jpg",
                                desc: row.desc || "تفاصيل المسلسل غير متوفرة حالياً."
                            });
                        }
                    });
                }
                
                if (seriesDB.length > 0) {
                    currentHero = {
                        name: seriesDB[0].name,
                        meta: `${seriesDB[0].genre} • ${seriesDB[0].year} • حصري`,
                        img: seriesDB[0].img
                    };
                }

                const resEps = await fetch(`https://opensheet.elk.sh/${sheetID}/${episodesSheet}`);
                if (resEps.ok) {
                    const dataEps = await resEps.json();
                    dataEps.forEach(row => {
                        if (row.series && row.episode && row.link) {
                            if (!linksDB[row.series]) linksDB[row.series] = {};
                            linksDB[row.series][row.episode] = row.link;
                        }
                    });
                }
            } catch (error) {
                console.error("❌ فشل سحب البيانات", error);
            } finally {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('home-view').style.display = 'block';
                    renderHome();
                }, 500);
            }
        }

        initApp();

        function renderHome() {
            document.getElementById('hero-section').style.backgroundImage = `url('${currentHero.img}')`;
            document.getElementById('hero-title').innerText = currentHero.name;
            document.getElementById('hero-meta').innerText = currentHero.meta;
            document.getElementById('hero-btn').onclick = () => openDetails(currentHero.name);

            const container = document.getElementById('dynamic-categories-container');
            container.innerHTML = ''; 

            const allCategories = [...new Set(seriesDB.map(s => s.cat))];

            allCategories.forEach(categoryName => {
                let titleDiv = document.createElement('div');
                titleDiv.className = "section-title";
                titleDiv.innerText = categoryName;
                
                let listDiv = document.createElement('div');
                listDiv.className = "scroll-list";
                
                const categorySeries = seriesDB.filter(s => s.cat === categoryName);
                
                categorySeries.forEach(s => {
                    let card = document.createElement('div');
                    card.className = "card";
                    card.onclick = () => openDetails(s.name);
                    card.innerHTML = `<img src="${s.img}" alt="${s.name}" loading="lazy">`;
                    listDiv.appendChild(card);
                });

                container.appendChild(titleDiv);
                container.appendChild(listDiv);
            });

            checkContinueWatching();
            checkMyList();
        }

        function toggleMyList(seriesName) {
            let myList = JSON.parse(localStorage.getItem('shnx_mylist')) || [];
            const index = myList.indexOf(seriesName);
            
            if (index === -1) {
                myList.push(seriesName); 
            } else {
                myList.splice(index, 1); 
            }
            
            localStorage.setItem('shnx_mylist', JSON.stringify(myList));
            updateMyListBtn(seriesName);
            checkMyList(); 
        }

        function updateMyListBtn(seriesName) {
            const btn = document.getElementById('add-list-btn');
            if(!btn) return;
            
            let myList = JSON.parse(localStorage.getItem('shnx_mylist')) || [];
            if (myList.includes(seriesName)) {
                btn.innerHTML = `✓ في قائمتي`;
                btn.classList.add('added');
            } else {
                btn.innerHTML = `➕ أضف لقائمتي`;
                btn.classList.remove('added');
            }
        }

        function checkMyList() {
            let myList = JSON.parse(localStorage.getItem('shnx_mylist')) || [];
            const section = document.getElementById('mylist-section');
            const list = document.getElementById('list-mylist');
            
            if (myList.length > 0) {
                section.style.display = 'block';
                list.innerHTML = '';
                
                myList.reverse().forEach(name => {
                    const s = seriesDB.find(x => x.name === name);
                    if(s) {
                        let card = document.createElement('div');
                        card.className = "card";
                        card.onclick = () => openDetails(s.name);
                        card.innerHTML = `<img src="${s.img}" alt="${s.name}" loading="lazy">`;
                        list.appendChild(card);
                    }
                });
            } else {
                section.style.display = 'none';
            }
        }

        function checkContinueWatching() {
            const data = localStorage.getItem('shnx_continue');
            const section = document.getElementById('continue-section');
            const list = document.getElementById('list-continue');
            
            if (data) {
                const item = JSON.parse(data);
                section.style.display = 'block';
                list.innerHTML = `
                    <div class="card continue-card" onclick="continueWatchingPlay('${item.name}', ${item.ep}, '${item.link}')">
                        <img src="${item.img}">
                        <div style="position: absolute; bottom: 10px; right: 10px; left: 10px; z-index: 2;">
                            <span style="background: var(--accent); padding: 3px 8px; border-radius: 4px; font-size: 11px;">الحلقة ${item.ep}</span>
                            <div style="font-weight: bold; margin-top: 5px; text-shadow: 0 2px 4px #000;">${item.name}</div>
                        </div>
                    </div>
                `;
            } else {
                section.style.display = 'none';
            }
        }

        function continueWatchingPlay(name, ep, link) {
            openDetails(name);
            setTimeout(() => {
                const epItems = document.querySelectorAll('#d-episodes-list .ep-item');
                let el = epItems.length >= ep ? epItems[ep - 1] : null;
                playVideo(link, el, ep, name);
            }, 100);
        }

        function handleSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            const mainCat = document.getElementById('main-categories');
            const hero = document.getElementById('hero-section');
            const searchSec = document.getElementById('search-section');
            const searchList = document.getElementById('list-search');

            if(q.length > 0) {
                mainCat.style.display = 'none';
                hero.style.display = 'none';
                searchSec.style.display = 'block';
                
                searchList.innerHTML = '';
                const results = seriesDB.filter(s => s.name.toLowerCase().includes(q));
                
                if(results.length > 0) {
                    results.forEach(s => {
                        let card = document.createElement('div');
                        card.className = "card";
                        card.style.marginBottom = "15px";
                        card.onclick = () => openDetails(s.name);
                        card.innerHTML = `<img src="${s.img}" alt="${s.name}">`;
                        searchList.appendChild(card);
                    });
                } else {
                    searchList.innerHTML = '<p style="color: var(--text-sec); width: 100%; text-align: center;">لا توجد نتائج مطابقة...</p>';
                }
            } else {
                mainCat.style.display = 'block';
                hero.style.display = 'flex';
                searchSec.style.display = 'none';
            }
        }

        function openDetails(name) {
            document.getElementById('searchInput').value = "";
            handleSearch();

            const data = seriesDB.find(s => s.name === name);
            if(!data) return;

            const page = document.getElementById('details-page');
            
            document.getElementById('d-title').innerText = data.name;
            document.getElementById('d-desc').innerText = data.desc;
            document.getElementById('d-hero').style.backgroundImage = `url('${data.img}')`;
            
            document.getElementById('d-meta').innerHTML = `
                <span class="meta-year">${data.year}</span>
                <span class="meta-tag">${data.genre}</span>
                <span class="meta-tag">1080p HD</span>
                <button id="add-list-btn" class="add-list-btn" onclick="toggleMyList('${data.name}')">➕ أضف لقائمتي</button>
            `;
            
            updateMyListBtn(data.name);

            document.getElementById('video-container').style.display = 'none';
            document.getElementById('next-ep-btn').style.display = 'none';
            document.getElementById('d-hero').style.display = 'block';
            document.getElementById('d-info-box').classList.remove('video-mode');
            
            renderEpisodes(name);
            
            page.style.display = 'block';
            page.classList.add('fade-in');
            document.body.style.overflow = 'hidden';
            page.scrollTo({top: 0});
            
            // دفع حالة جديدة للمتصفح لدعم زر الرجوع في الجوال
            history.pushState({ page: 'details' }, null, '');
        }

        // الاستماع لزر الرجوع في الجوال
        window.addEventListener('popstate', function(event) {
            const page = document.getElementById('details-page');
            if (page.style.display === 'block') {
                closeDetails();
            }
        });

        function renderEpisodes(name) {
            const container = document.getElementById('d-episodes-list');
            container.innerHTML = "";
            
            const epData = linksDB[name] || {};
            let maxEp = 30;
            const existingEps = Object.keys(epData).map(Number);
            if(existingEps.length > 0) {
                maxEp = Math.max(30, ...existingEps); 
            }

            for (let i = 1; i <= maxEp; i++) {
                const link = epData[i];
                const item = document.createElement('div');
                item.className = "ep-item";
                item.style.opacity = link ? "1" : "0.4";
                item.innerHTML = `
                    <div class="ep-number">${i}</div>
                    <div>
                        <div style="font-weight: bold;">الحلقة ${i}</div>
                        <div style="font-size: 12px; color: ${link ? 'var(--accent)' : 'var(--text-sec)'};">${link ? 'شاهد الآن' : 'قريباً'}</div>
                    </div>
                `;
                if(link) item.onclick = () => playVideo(link, item, i, name);
                container.appendChild(item);
            }
        }

        function playVideo(url, el, epNum, seriesName) {
            document.getElementById('d-hero').style.display = 'none';
            const container = document.getElementById('video-container');
            container.style.display = 'block';
            document.getElementById('video-frame').src = url;
            document.getElementById('d-info-box').classList.add('video-mode');
            
            currentlyPlayingSeries = seriesName;
            currentlyPlayingEp = epNum;
            checkNextEpisode();

            document.querySelectorAll('.ep-item').forEach(i => i.classList.remove('active'));
            if(el) el.classList.add('active');
            
            document.getElementById('details-page').scrollTo({top: 0, behavior: 'smooth'});

            if(seriesName && epNum) {
                const seriesData = seriesDB.find(s => s.name === seriesName);
                if (seriesData) {
                    localStorage.setItem('shnx_continue', JSON.stringify({
                        name: seriesName,
                        img: seriesData.img,
                        ep: epNum,
                        link: url
                    }));
                    checkContinueWatching();
                }
            }
        }

        function checkNextEpisode() {
            const nextBtn = document.getElementById('next-ep-btn');
            const nextEpNum = currentlyPlayingEp + 1;
            const epData = linksDB[currentlyPlayingSeries] || {};
            
            if (epData[nextEpNum]) {
                nextBtn.style.display = 'block';
            } else {
                nextBtn.style.display = 'none';
            }
        }

        function playNextEpisode() {
            const nextEpNum = currentlyPlayingEp + 1;
            const nextLink = linksDB[currentlyPlayingSeries][nextEpNum];
            
            if (nextLink) {
                const epItems = document.querySelectorAll('#d-episodes-list .ep-item');
                let el = epItems.length >= nextEpNum ? epItems[nextEpNum - 1] : null;
                playVideo(nextLink, el, nextEpNum, currentlyPlayingSeries);
            }
        }

        function closeDetails() {
            document.getElementById('video-frame').src = "";
            document.getElementById('details-page').style.display = 'none';
            document.body.style.overflow = 'auto';
            document.getElementById('searchInput').value = ""; 
            handleSearch();
        }

    </script> 
    
</body>
</html>
