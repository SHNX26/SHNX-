<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SHNX | منصة المشاهدة الأولى</title>

    <style>
        :root {
            --bg: #050505;
            --surface: #141414;
            --accent: #E50914;
            --text: #ffffff;
            --text-sec: #b3b3b3;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body { 
            margin: 0; 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, system-ui, Roboto, sans-serif; 
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- شاشة التحميل --- */
        #loader {
            position: fixed; inset: 0; z-index: 99999;
            background-color: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .loader-logo { font-size: 45px; font-weight: 900; color: var(--accent); letter-spacing: 2px; text-shadow: 0 0 20px rgba(229, 9, 20, 0.6); animation: pulse 1.5s infinite; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; margin-top: 20px; animation: spin 1s linear infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 30px rgba(229, 9, 20, 1); } 100% { transform: scale(1); opacity: 0.8; } }
        @keyframes spin { to { transform: rotate(360deg); } }

        .fade-in { animation: fadeIn 0.5s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        header { 
            position: fixed; top: 0; width: 100%; height: 70px; z-index: 1000; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%); 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 5%; box-sizing: border-box; 
            backdrop-filter: blur(2px);
        }
        .logo { font-size: 28px; font-weight: 900; color: var(--accent); text-shadow: 0 0 15px rgba(229, 9, 20, 0.4); letter-spacing: 1px;}

        .search-box {
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px; padding: 8px 15px; color: white; width: 140px; 
            outline: none; transition: var(--transition); font-family: inherit;
            backdrop-filter: blur(5px);
        }
        .search-box:focus { width: 190px; background: rgba(0,0,0,0.6); border-color: var(--accent); box-shadow: 0 0 10px rgba(229,9,20,0.3); }
        .search-box::placeholder { color: #ccc; }

        .tg-fab { 
            position: fixed; bottom: 25px; left: 20px; z-index: 1000;
            background: #0088cc; color: white; padding: 12px 20px; 
            border-radius: 30px; text-decoration: none; font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
            display: flex; align-items: center; gap: 8px; transition: var(--transition);
        }
        .tg-fab:active { transform: scale(0.9); }

        .hero { 
            height: 75vh; position: relative; 
            background-size: cover; background-position: center top; 
            display: flex; align-items: flex-end; 
            transition: background-image 0.5s ease-in-out;
        }
        .hero::after { 
            content: ''; position: absolute; inset: 0; 
            background: linear-gradient(to top, var(--bg) 5%, rgba(0,0,0,0.5) 40%, rgba(0,0,0,0.2) 100%); 
        }
        .hero-content { position: relative; z-index: 2; padding: 40px 5%; width: 100%; text-align: center; }
        .btn-play-hero { 
            background: #fff; color: #000; border: none; padding: 14px 40px; 
            border-radius: 4px; font-weight: 900; font-size: 16px; 
            cursor: pointer; transition: var(--transition); 
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-play-hero:hover { background: #e6e6e6; transform: scale(1.05); }
        .btn-play-hero:active { transform: scale(0.95); opacity: 0.8; }

        .section-title { font-size: 20px; font-weight: 800; margin: 30px 5% 15px; border-right: 4px solid var(--accent); padding-right: 12px; }
        .scroll-list { display: flex; overflow-x: auto; padding: 10px 5% 30px; gap: 15px; scrollbar-width: none; }
        .scroll-list::-webkit-scrollbar { display: none; }
        
        .card { 
            min-width: 130px; position: relative; cursor: pointer; 
            border-radius: 6px; transition: var(--transition);
            transform-origin: center;
        }
        .card img { 
            width: 100%; height: 190px; border-radius: 6px; object-fit: cover; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: var(--transition);
        }
        .card::after {
            content: ''; position: absolute; inset: 0; border-radius: 6px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 50%);
            opacity: 0; transition: var(--transition);
        }
        .card:hover, .card:active { transform: scale(1.08); z-index: 10; }
        .card:hover::after, .card:active::after { opacity: 1; }
        .card:hover img, .card:active img { box-shadow: 0 10px 20px rgba(0,0,0,0.8); }

        .continue-card { min-width: 200px; }
        .continue-card img { height: 120px; opacity: 0.8; }

        #details-page { display: none; position: fixed; inset: 0; z-index: 2000; background: var(--bg); overflow-y: auto; }
        #video-container { display: none; width: 100%; aspect-ratio: 16/9; background: #000; position: sticky; top: 0; z-index: 2100; box-shadow: 0 5px 20px rgba(0,0,0,0.9); }
        #video-container iframe { width: 100%; height: 100%; border: none; }

        .details-hero { height: 50vh; background-size: cover; background-position: center top; position: relative; }
        .details-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 5%, transparent); }

        .close-btn { 
            position: fixed; top: 20px; left: 20px; z-index: 9999 !important; 
            background: rgba(0,0,0,0.7); color: white; border: 2px solid rgba(255,255,255,0.2); 
            width: 42px; height: 42px; border-radius: 50%; font-size: 22px; font-weight: bold;
            backdrop-filter: blur(10px); cursor: pointer; transition: var(--transition);
            transform: translateZ(0); display: flex; align-items: center; justify-content: center;
        }
        .close-btn:active { transform: scale(0.9); background: var(--accent); border-color: var(--accent); }

        .details-info { padding: 0 5%; transition: var(--transition); transform: translateY(-70px); position: relative; z-index: 5; }
        .details-info.video-mode { transform: translateY(15px); }
        
        .d-meta-tags { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .meta-tag { background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; color: #ddd; }
        .meta-year { color: #46d369; font-weight: bold; font-size: 14px; }

        .ep-item { display: flex; align-items: center; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-bottom: 12px; gap: 15px; border: 1px solid transparent; transition: var(--transition); cursor: pointer;}
        .ep-item:hover { background: rgba(255,255,255,0.1); }
        .ep-item:active { transform: scale(0.98); }
        .ep-item.active { border-color: var(--accent); background: rgba(229, 9, 20, 0.1); }
        .ep-number { width: 45px; height: 45px; background: rgba(255,255,255,0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; }
        .active .ep-number { background: var(--accent); box-shadow: 0 0 10px rgba(229,9,20,0.5); }
    </style>
</head>
<body>

    <!-- شاشة التحميل -->
    <div id="loader">
        <div class="loader-logo">SHNX</div>
        <div class="spinner"></div>
    </div>

    <header id="main-header">
        <div class="logo">SHNX</div>
        <input type="text" id="searchInput" class="search-box" placeholder="بحث عن مسلسل..." onkeyup="handleSearch()">
    </header>

    <!-- تم تحديث رابط القناة -->
    <a href="https://t.me/shnx6" target="_blank" class="tg-fab">
        قناتنا
    </a>

    <div id="home-view" style="display:none;" class="fade-in">
        <div class="hero" id="hero-section">
            <div class="hero-content">
                <h1 id="hero-title" style="font-size: 42px; margin: 0 0 10px; text-shadow: 0 4px 8px rgba(0,0,0,0.8);"></h1>
                <p id="hero-meta" style="color: #ddd; font-weight: bold; margin-bottom: 25px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);"></p>
                <button class="btn-play-hero" id="hero-btn">▶ مشاهدة الآن</button>
            </div>
        </div>

        <div id="search-section" style="display:none; padding-top: 80px;">
            <div class="section-title">نتائج البحث 🔍</div>
            <div class="scroll-list" id="list-search" style="flex-wrap: wrap;"></div>
        </div>

        <div id="main-categories">
            <div id="continue-section" style="display:none;">
                <div class="section-title">أكمل المشاهدة 🕒</div>
                <div class="scroll-list" id="list-continue"></div>
            </div>

            <div class="section-title">رمضان 2026 🔥</div>
            <div class="scroll-list" id="list-trending"></div>

            <div class="section-title">كوميديا وضحك 😂</div>
            <div class="scroll-list" id="list-comedy"></div>

            <div class="section-title">دراما وتشويق 🎬</div>
            <div class="scroll-list" id="list-drama"></div>
        </div>
    </div>

    <div id="details-page">
        <button class="close-btn" onclick="closeDetails()">✕</button>
        <div id="video-container">
            <!-- تمت إضافة sandbox لحماية الزوار من الإعلانات المنبثقة الإجبارية -->
            <iframe id="video-frame" src="" allowfullscreen allow="autoplay; fullscreen" sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>
        </div>
        <div class="details-hero" id="d-hero"></div>
        <div class="details-info" id="d-info-box">
            <h1 class="d-title" id="d-title" style="font-size: 34px; margin: 0 0 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);"></h1>
            
            <div class="d-meta-tags" id="d-meta"></div>

            <p class="d-desc" id="d-desc" style="color: var(--text-sec); line-height: 1.8; margin-bottom: 30px; font-size: 15px;"></p>
            <h3 style="margin-bottom: 20px; border-right: 3px solid var(--accent); padding-right: 10px; font-size: 18px;">قائمة الحلقات</h3>
            <div id="d-episodes-list"></div>
        </div>
    </div>

    <script>
        // المتغيرات الديناميكية اللي تتعبى من الإكسل
        let seriesDB = [];
        let linksDB = {};
        let currentHero = {};

        // معرف الشيت واسم الصفحات
        const sheetID = "1UChkTwIZFxkwV0vDepyNcWNe0Gb6eSbpDajdWX5mvOE";
        const episodesSheet = "Sheet1"; 
        const seriesSheet = "Series"; 

        async function fetchAllData() {
            try {
                // 1. جلب بيانات المسلسلات (البوسترات والقصة)
                const resSeries = await fetch(`https://opensheet.elk.sh/${sheetID}/${seriesSheet}`);
                if (resSeries.ok) {
                    const dataSeries = await resSeries.json();
                    dataSeries.forEach(row => {
                        if(row.name) {
                            seriesDB.push({
                                name: row.name,
                                cat: row.cat || "trending",
                                year: row.year || "2026",
                                genre: row.genre || "دراما",
                                img: row.img || "https://i.ibb.co/hJTvQBRJ/20260216-133106.jpg",
                                desc: row.desc || "تفاصيل المسلسل غير متوفرة حالياً."
                            });
                        }
                    });
                    
                    // تعيين أول مسلسل كواجهة رئيسية (Hero) إذا كانت القائمة مو فاضية
                    if(seriesDB.length > 0) {
                        currentHero = {
                            name: seriesDB[0].name,
                            meta: `${seriesDB[0].genre} • رمضان ${seriesDB[0].year} • حصري`,
                            img: seriesDB[0].img
                        };
                    }
                }

                // 2. جلب الحلقات
                const resEps = await fetch(`https://opensheet.elk.sh/${sheetID}/${episodesSheet}`);
                if (resEps.ok) {
                    const dataEps = await resEps.json();
                    dataEps.forEach(row => {
                        if (row.series && row.episode && row.link) {
                            if (!linksDB[row.series]) linksDB[row.series] = {};
                            linksDB[row.series][row.episode] = row.link;
                        }
                    });
                }

                // بعد اكتمال سحب البيانات، نخفي التحميل ونعرض الموقع
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('home-view').style.display = 'block';
                    renderHome();
                }, 500);

            } catch (error) {
                console.error("❌ فشل سحب البيانات من الإكسل", error);
                document.getElementById('loader').innerHTML = '<div style="color:var(--accent); font-weight:bold;">حدث خطأ في الاتصال بقاعدة البيانات. يرجى تحديث الصفحة.</div>';
            }
        }

        // بدء سحب البيانات فوراً
        fetchAllData();

        function renderHome() {
            if(seriesDB.length === 0) return; // إذا الإكسل فاضي

            document.getElementById('hero-section').style.backgroundImage = `url('${currentHero.img}')`;
            document.getElementById('hero-title').innerText = currentHero.name;
            document.getElementById('hero-meta').innerText = currentHero.meta;
            document.getElementById('hero-btn').onclick = () => openDetails(currentHero.name);

            // تصفير القوائم عشان لو حدثنا ما تتكرر
            document.getElementById('list-trending').innerHTML = '';
            document.getElementById('list-comedy').innerHTML = '';
            document.getElementById('list-drama').innerHTML = '';

            seriesDB.forEach(s => {
                let listId = s.cat === "trending" ? "list-trending" : (s.cat === "comedy" ? "list-comedy" : "list-drama");
                let container = document.getElementById(listId);
                if(container) {
                    let card = document.createElement('div');
                    card.className = "card";
                    card.onclick = () => openDetails(s.name);
                    card.innerHTML = `<img src="${s.img}" alt="${s.name}">`;
                    container.appendChild(card);
                }
            });
            checkContinueWatching();
        }

        function checkContinueWatching() {
            const data = localStorage.getItem('shnx_continue');
            const section = document.getElementById('continue-section');
            const list = document.getElementById('list-continue');
            
            if (data) {
                const item = JSON.parse(data);
                section.style.display = 'block';
                list.innerHTML = `
                    <div class="card continue-card" onclick="continueWatchingPlay('${item.name}', ${item.ep}, '${item.link}')">
                        <img src="${item.img}">
                        <div style="position: absolute; bottom: 10px; right: 10px; left: 10px; z-index: 2;">
                            <span style="background: var(--accent); padding: 3px 8px; border-radius: 4px; font-size: 11px;">الحلقة ${item.ep}</span>
                            <div style="font-weight: bold; margin-top: 5px; text-shadow: 0 2px 4px #000;">${item.name}</div>
                        </div>
                    </div>
                `;
            } else {
                section.style.display = 'none';
            }
        }

        function continueWatchingPlay(name, ep, link) {
            openDetails(name);
            setTimeout(() => {
                const epItems = document.querySelectorAll('#d-episodes-list .ep-item');
                let el = epItems.length >= ep ? epItems[ep - 1] : null;
                playVideo(link, el, ep, name);
            }, 100);
        }

        function handleSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            const mainCat = document.getElementById('main-categories');
            const hero = document.getElementById('hero-section');
            const searchSec = document.getElementById('search-section');
            const searchList = document.getElementById('list-search');

            if(q.length > 0) {
                mainCat.style.display = 'none';
                hero.style.display = 'none';
                searchSec.style.display = 'block';
                
                searchList.innerHTML = '';
                const results = seriesDB.filter(s => s.name.toLowerCase().includes(q));
                
                if(results.length > 0) {
                    results.forEach(s => {
                        let card = document.createElement('div');
                        card.className = "card";
                        card.style.marginBottom = "15px";
                        card.onclick = () => openDetails(s.name);
                        card.innerHTML = `<img src="${s.img}" alt="${s.name}">`;
                        searchList.appendChild(card);
                    });
                } else {
                    searchList.innerHTML = '<p style="color: var(--text-sec); width: 100%; text-align: center;">لا توجد نتائج مطابقة...</p>';
                }
            } else {
                mainCat.style.display = 'block';
                hero.style.display = 'flex';
                searchSec.style.display = 'none';
                checkContinueWatching();
            }
        }

        function openDetails(name) {
            const data = seriesDB.find(s => s.name === name);
            if(!data) return;

            const page = document.getElementById('details-page');
            
            document.getElementById('d-title').innerText = data.name;
            document.getElementById('d-desc').innerText = data.desc;
            document.getElementById('d-hero').style.backgroundImage = `url('${data.img}')`;
            
            document.getElementById('d-meta').innerHTML = `
                <span class="meta-year">${data.year}</span>
                <span class="meta-tag">${data.genre}</span>
                <span class="meta-tag">1080p HD</span>
            `;

            document.getElementById('video-container').style.display = 'none';
            document.getElementById('d-hero').style.display = 'block';
            document.getElementById('d-info-box').classList.remove('video-mode');
            
            renderEpisodes(name);
            
            page.style.display = 'block';
            page.classList.add('fade-in');
            document.body.style.overflow = 'hidden';
        }

        function renderEpisodes(name) {
            const container = document.getElementById('d-episodes-list');
            container.innerHTML = "";
            
            const epData = linksDB[name] || {};
            let maxEp = 30;
            const existingEps = Object.keys(epData).map(Number);
            if(existingEps.length > 0) {
                maxEp = Math.max(30, ...existingEps); 
            }

            for (let i = 1; i <= maxEp; i++) {
                const link = epData[i];
                const item = document.createElement('div');
                item.className = "ep-item";
                item.style.opacity = link ? "1" : "0.4";
                item.innerHTML = `
                    <div class="ep-number">${i}</div>
                    <div>
                        <div style="font-weight: bold;">الحلقة ${i}</div>
                        <div style="font-size: 12px; color: ${link ? 'var(--accent)' : 'var(--text-sec)'};">${link ? 'شاهد الآن' : 'قريباً'}</div>
                    </div>
                `;
                if(link) item.onclick = () => playVideo(link, item, i, name);
                container.appendChild(item);
            }
        }

        function playVideo(url, el, epNum, seriesName) {
            document.getElementById('d-hero').style.display = 'none';
            const container = document.getElementById('video-container');
            container.style.display = 'block';
            document.getElementById('video-frame').src = url;
            document.getElementById('d-info-box').classList.add('video-mode');
            
            document.querySelectorAll('.ep-item').forEach(i => i.classList.remove('active'));
            if(el) el.classList.add('active');
            
            document.getElementById('details-page').scrollTo({top: 0, behavior: 'smooth'});

            if(seriesName && epNum) {
                const seriesData = seriesDB.find(s => s.name === seriesName);
                if(seriesData) {
                    localStorage.setItem('shnx_continue', JSON.stringify({
                        name: seriesName,
                        img: seriesData.img,
                        ep: epNum,
                        link: url
                    }));
                    checkContinueWatching();
                }
            }
        }

        function closeDetails() {
            document.getElementById('video-frame').src = "";
            document.getElementById('details-page').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

    </script> 
    
</body>
</html>
