<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SHNX | منصة المشاهدة الأولى</title>
  <meta name="description" content="تابع أحدث المسلسلات، كوميديا، دراما، وأكثر. مشاهدة ممتعة بدون إعلانات مزعجة!">

  <!-- مظهر الرابط عند النشر -->
  <meta property="og:title" content="SHNX | منصة المشاهدة الأولى">
  <meta property="og:description" content="تابع أحدث المسلسلات، كوميديا، دراما، وأكثر. مشاهدة ممتعة بدون إعلانات مزعجة!">
  <meta property="og:image" content="https://i.postimg.cc/yx5FjBTn/20261022-153447.jpg">
  <meta property="og:url" content="https://shnx26.github.io/SHNX-/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ar_SA">
  <meta name="twitter:card" content="summary_large_image">

  <!-- تطبيق على الجوال (PWA) -->
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SHNX">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://opensheet.elk.sh" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // الشعار المتحرك يطلع مرة وحدة بكل زيارة، وما يطلع لو الرابط يفتح مسلسل مباشرة
    try {
      if (sessionStorage.getItem('shnx_intro') || /[?&]s=/.test(location.search)) document.documentElement.classList.add('no-intro');
    } catch (e) { document.documentElement.classList.add('no-intro'); }
  </script>
</head>
<body>

  <!-- الشعار المتحرك عند الدخول -->
  <div id="intro" aria-hidden="true">
    <div class="intro-logo"><span>S</span><span>H</span><span>N</span><span>X</span></div>
    <div class="intro-line"></div>
  </div>

  <!-- الهيدر -->
  <header class="topbar" id="topbar">
    <button class="logo" id="logo-btn" type="button" aria-label="الصفحة الرئيسية">SHNX</button>

    <nav class="top-nav" aria-label="التنقل الرئيسي">
      <button type="button" data-nav="home" class="active">الرئيسية</button>
      <button type="button" data-nav="browse">تصفّح</button>
      <button type="button" data-nav="mylist">قائمتي</button>
    </nav>

    <label class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="search-input" class="search-box" placeholder="ابحث عن مسلسل..." autocomplete="off" enterkeyhint="search" aria-label="بحث عن مسلسل">
    </label>
  </header>

  <main id="app">
    <!-- الرئيسية -->
    <section id="view-home" class="view" aria-label="الرئيسية">
      <div class="hero" id="hero">
        <div class="hero-skeleton">
          <div class="sk sk-line sk-title"></div>
          <div class="sk sk-line sk-meta"></div>
          <div class="sk sk-btn"></div>
        </div>
      </div>
      <div id="home-rows">
        <div class="row">
          <div class="sk sk-line sk-row-title"></div>
          <div class="scroll-list">
            <div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div>
          </div>
        </div>
        <div class="row">
          <div class="sk sk-line sk-row-title"></div>
          <div class="scroll-list">
            <div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- التصفح والبحث -->
    <section id="view-browse" class="view page" hidden aria-label="تصفّح">
      <h2 class="page-title" id="browse-title">تصفّح</h2>
      <div class="chips" id="chips" role="tablist" aria-label="التصنيفات"></div>
      <div class="grid" id="browse-grid"></div>
      <p class="empty" id="browse-empty" hidden>لا توجد نتائج مطابقة...</p>
    </section>

    <!-- قائمتي -->
    <section id="view-mylist" class="view page" hidden aria-label="قائمتي">
      <h2 class="page-title">قائمتي</h2>
      <div class="grid" id="mylist-grid"></div>
      <div class="empty" id="mylist-empty" hidden>
        <p>قائمتك فاضية حالياً 📌</p>
        <p class="empty-sub">اضغط "قائمتي" في صفحة أي مسلسل عشان تحفظه هنا.</p>
      </div>
    </section>
  </main>

  <!-- صفحة تفاصيل المسلسل -->
  <div id="details" class="details" hidden role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="d-ambient" id="d-ambient" aria-hidden="true"></div>
    <div class="d-topbar" id="d-topbar">
      <button type="button" class="back-btn" id="back-btn" aria-label="رجوع">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        رجوع
      </button>
      <span class="d-topbar-title" id="d-topbar-title"></span>
    </div>

    <div class="player" id="player" hidden>
      <div class="player-frame" id="player-frame">
        <iframe id="video-frame" title="مشغل الفيديو" src="about:blank" allowfullscreen allow="autoplay; fullscreen; picture-in-picture" sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>
      </div>
      <div class="player-bar">
        <button type="button" class="pbtn" id="prev-ep-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          السابقة
        </button>
        <span class="now-playing" id="now-playing"></span>
        <button type="button" class="pbtn" id="fs-btn" aria-label="ملء الشاشة">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <button type="button" class="pbtn pbtn-accent" id="next-ep-btn">
          التالية
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>
    </div>

    <div class="d-hero" id="d-hero"></div>

    <div class="d-info" id="d-info">
      <h1 class="d-title rv" id="d-title" style="--rv:0"></h1>
      <div class="d-meta rv" id="d-meta" style="--rv:1"></div>
      <div class="d-actions rv" style="--rv:2">
        <button type="button" class="btn btn-primary" id="d-play">▶ تشغيل</button>
        <button type="button" class="btn btn-ghost" id="d-mylist">＋ قائمتي</button>
        <button type="button" class="btn btn-ghost btn-icon" id="d-share" aria-label="مشاركة">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
          مشاركة
        </button>
      </div>
      <p class="d-desc rv" id="d-desc" style="--rv:3"></p>

      <div class="ep-head rv" style="--rv:4">
        <h3>الحلقات</h3>
        <button type="button" class="view-toggle" id="ep-view-btn" aria-label="تبديل طريقة عرض الحلقات">
          <svg class="ic-grid" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <svg class="ic-list" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
        </button>
      </div>
      <div class="ep-tools rv" id="ep-tools" style="--rv:5">
        <div class="season-tabs" id="season-tabs" role="tablist" aria-label="المواسم"></div>
        <div class="range-bar" id="range-bar" aria-label="انتقال سريع للحلقات"></div>
      </div>
      <div class="ep-list" id="d-episodes"></div>
    </div>
  </div>

  <!-- الشريط السفلي للجوال -->
  <nav class="bottom-nav" id="bottom-nav" aria-label="التنقل">
    <span class="nav-indicator" id="nav-indicator" aria-hidden="true"></span>
    <button type="button" data-nav="home" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>الرئيسية</span>
    </button>
    <button type="button" data-nav="browse" data-focus-search="1">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>بحث</span>
    </button>
    <button type="button" data-nav="mylist">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
      <span>قائمتي</span>
    </button>
  </nav>

  <a href="https://t.me/shnx6" target="_blank" rel="noopener" class="tg-fab" id="tg-fab" aria-label="قناتنا على تيليجرام">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 4.3 2.9 11.5c-1.3.5-1.3 1.2-.2 1.6l4.8 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.6c.3-1.3-.5-1.9-1.4-1.5zM8.2 14.2l9.6-6.1c.5-.3.9-.1.5.2l-8 7.3-.3 3.3z"/></svg>
    <span>قناتنا</span>
  </a>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
